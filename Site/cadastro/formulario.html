<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Inside Muay Thai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../estilo/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg sticky-top">
            <div class="container">
                <a href="../index.html" class="navbar-brand">
                    <img src="../imagens/logofogo.jpeg" alt="Logo" height="50">
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-center gap-3">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="../academia/sobre.html">Inside</a></li>
                        <li class="nav-item"><a class="nav-link" href="../professor/biografia.html">Professor</a></li>
                        <li class="nav-item"><a class="nav-link" href="../planos/mensalidade.html">Planos</a></li>
                        <li class="nav-item"><a class="btn-main" href="../usuario/conta.html">Conta</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="custom-card shadow-lg">
                    <h2 class="text-center mb-4">Junte-se à <span class="text-danger">Elite</span></h2>
                    
                    <form id="cadastroForm">
                        <div class="mb-3">
                            <label for="nome" class="form-label text-gray">Nome completo</label>
                            <input type="text" class="form-control custom-input" id="nome" placeholder="Digite seu nome completo" required>
                        </div>

                        <div class="mb-3">
                            <label for="nascimento" class="form-label text-gray">Data de Nascimento</label>
                            <input type="date" class="form-control custom-input" id="nascimento" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefone" class="form-label text-gray">Telefone / Celular</label>
                            <input type="tel" class="form-control custom-input" id="telefone" placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label text-gray">Seu E-mail</label>
                            <input type="email" class="form-control custom-input" id="email" placeholder="email@exemplo.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="nivel" class="form-label text-gray">Nível de Experiência</label>
                            <select class="form-select custom-input" id="nivel" required>
                                <option selected disabled value="">Selecione seu nível</option>
                                <option value="iniciante">Iniciante</option>
                                <option value="intermediario">Intermediário</option>
                                <option value="avancado">Avançado</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="lesao" class="form-label text-gray">Possui alguma lesão ou condição médica?</label>
                            <textarea class="form-control custom-input" id="lesao" rows="2" placeholder="Descreva aqui ou digite 'Nenhuma'"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label text-gray">Senha</label>
                            <input type="password" class="form-control custom-input" id="senha" required>
                        </div>

                        <button type="submit" class="btn-main w-100 mt-3">Confirmar Cadastro</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center">
        <div class="container">
            <p class="small">© 2026 Inside Muay Thai Valinhos. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script>
        document.getElementById("cadastroForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const dados = {
                nome: document.getElementById("nome").value,
                nascimento: document.getElementById("nascimento").value,
                telefone: document.getElementById("telefone").value,
                email: document.getElementById("email").value,
                nivel: document.getElementById("nivel").value,
                lesao: document.getElementById("lesao").value,
                senha: document.getElementById("senha").value
            };

            localStorage.setItem("dadosCadastro", JSON.stringify(dados));
            window.location.href = "../usuario/conta.html";
        });
    </script>
</body>
</html>
