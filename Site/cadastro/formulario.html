<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilo/geral.css">
    <title>Cadastro</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand bg-dark navbar-dark">
            <div class="container-fluid">
                <ul class="nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#">Menu</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="../Pagina_Principal.html">Início</a></li>
                            <li><a class="dropdown-item" href="../professor/biografia.html">Professor</a></li>
                            <li><a class="dropdown-item" href="../planos/mensalidade.html">Planos</a></li>
                            <li><a class="dropdown-item" href="../usuario/conta.html">Conta</a></li>
                            <li><a class="dropdown-item" href="../cadastro/formulario.html">Cadastro</a></li>
                        </ul>
                    </li>
                </ul>
                <a href="../Pagina_Principal.html" class="mx-auto">
                    <img src="../imagens/logo_sem_fundo.png" alt="Clique aqui para ir à página inicial" class="logo-nav">
                </a>
            </div>           
        </nav>
    </header>

    <main class="container py-4">
        <form>
            <div class="mb-3">
                <label for="exampleInputName1" class="form-label">Nome completo</label>
                <input type="text" class="form-control" id="exampleInputName1" placeholder="Digite seu nome completo">
            </div>

            <div class="mb-3">
                <label for="nascimento" class="form-label">Data de Nascimento</label>
                <input type="date" class="form-control" id="nascimento">
            </div>

            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone / Celular</label>
                <input type="tel" class="form-control" id="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Seu E-mail</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="email@exemplo.com">
            </div>

            <div class="mb-3">
                <label for="nivel" class="form-label">Nível de Experiência</label>
                <select class="form-select" id="nivel">
                    <option selected disabled>Selecione seu nível</option>
                    <option value="iniciante">Iniciante</option>
                    <option value="intermediario">Intermediário</option>
                    <option value="avancado">Avançado</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="lesao" class="form-label">Possui alguma lesão ou condição médica?</label>
                <textarea class="form-control" id="lesao" rows="2" placeholder="Descreva aqui se houver, ou digite 'Nenhuma'"></textarea>
            </div>

            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Senha</label>
                <input type="password" class="form-control" id="exampleInputPassword1">
            </div>

            <button type="submit" class="btn btn-primary w-100">Confirmar cadastro</button>
        </form>
    </main>

    <footer class="text-center py-3">
        <p>© 2023 Nome da Instituição. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
