    <style>
        /* Ajuste específico para o carrossel no index */
        .carousel-item img {

        }

            box-shadow: 0 10px 30px rgba(0,0,0,0.8);

            background: transparent;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;

        .btn-outline-gold:hover {
