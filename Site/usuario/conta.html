      crossorigin="anonymous">
  <link rel="stylesheet" href="../estilo/geral.css">
  <title>Conta</title>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand bg-dark navbar-dark">
      <div class="container-fluid">
        <ul class="nav">
          <li class="nav-item dropdown">

        <a href="../index.html" class="mx-auto">
          <img src="C:\Users\Hewlett Packard\Downloads\logofogo.jpg.jpeg" alt="Logo" class="logo-nav">
        </a>
        <a href="../cadastro/formulario.html" class="cadastro">Cadastre-se</a>
      </div>
    </nav>

  <main class="container py-4">
    <h2>Minha Conta</h2>
    <div id="dadosConta" class="mt-3"></div>
    <button id="editarBtn" class="btn btn-warning mt-3">Editar dados</button>

    <!-- Formulário de edição oculto -->
    <form id="editarForm" class="mt-3" style="display:none;">
      <div class="mb-2">
        <label for="editNome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="editNome">
      </div>
      <div class="mb-2">
        <label for="editNascimento" class="form-label">Nascimento</label>
        <input type="date" class="form-control" id="editNascimento">
      </div>
      <div class="mb-2">
        <label for="editTelefone" class="form-label">Telefone</label>
        <input type="tel" class="form-control" id="editTelefone">
      </div>
      <div class="mb-2">
        <label for="editEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="editEmail">
      </div>
      <div class="mb-2">
        <label for="editNivel" class="form-label">Nível</label>
        <select class="form-select" id="editNivel">
          <option value="iniciante">Iniciante</option>
          <option value="intermediario">Intermediário</option>
          <option value="avancado">Avançado</option>
        </select>
      </div>
      <div class="mb-2">
        <label for="editLesao" class="form-label">Lesão</label>
        <textarea class="form-control" id="editLesao" rows="2"></textarea>
      </div>
      <button type="submit" class="btn btn-success w-100">Salvar alterações</button>
    </form>
  </main>

  <footer class="text-center py-3">
    <p>© 2023 Nome da Instituição. Todos os direitos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const dados = JSON.parse(localStorage.getItem("dadosCadastro"));
      const div = document.getElementById("dadosConta");
      const editarBtn = document.getElementById("editarBtn");
      const editarForm = document.getElementById("editarForm");

      function mostrarDados() {
        if (dados) {
          div.innerHTML = `
            <p><strong>Nome:</strong> ${dados.nome}</p>
            <p><strong>Nascimento:</strong> ${dados.nascimento}</p>
            <p><strong>Telefone:</strong> ${dados.telefone}</p>
            <p><strong>Email:</strong> ${dados.email}</p>
            <p><strong>Nível:</strong> ${dados.nivel}</p>
            <p><strong>Lesão:</strong> ${dados.lesao}</p>
          `;
        } else {
          div.innerHTML = "<p>Nenhum cadastro encontrado.</p>";
          editarBtn.style.display = "none";
        }
      }

      mostrarDados();

      // Mostrar formulário de edição com dados preenchidos
      editarBtn.addEventListener("click", function() {
        editarForm.style.display = "block";
        document.getElementById("editNome").value = dados.nome;
        document.getElementById("editNascimento").value = dados.nascimento;
        document.getElementById("editTelefone").value = dados.telefone;
        document.getElementById("editEmail").value = dados.email;
        document.getElementById("editNivel").value = dados.nivel;
        document.getElementById("editLesao").value = dados.lesao;
      });

      // Salvar alterações
      editarForm.addEventListener("submit", function(event) {
        event.preventDefault();
        const novosDados = {
          nome: document.getElementById("editNome").value,
          nascimento: document.getElementById("editNascimento").value,
          telefone: document.getElementById("editTelefone").value,
          email: document.getElementById("editEmail").value,
          nivel: document.getElementById("editNivel").value,
          lesao: document.getElementById("editLesao").value
        };
        localStorage.setItem("dadosCadastro", JSON.stringify(novosDados));
        alert("Dados atualizados com sucesso!");
        location.reload(); // recarrega a página para mostrar os novos dados
      });
    });
  </script>
</body>
</html>
