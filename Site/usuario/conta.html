<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta | Inside Muay Thai</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../estilo/style.css">
    <style>
        /* Ajustes específicos para a área logada */
        .user-data-item {
            border-bottom: 1px solid #222;
            padding: 10px 0;
        }
        .user-data-item strong {
            color: var(--gold);
            display: inline-block;
            width: 120px;
        }
        .btn-edit {
            border: 1px solid var(--gold);
            color: var(--gold);
            background: transparent;
            transition: 0.3s;
        }
        .btn-edit:hover {
            background: var(--gold);
            color: black;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg sticky-top">
            <div class="container">
                <a href="../index.html" class="navbar-brand">
                    <img src="../imagens/logofogo.jpeg" alt="Logo" height="50">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-center gap-3">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="../academia/sobre.html">Inside</a></li>
                        <li class="nav-item"><a class="nav-link" href="../professor/biografia.html">Professor</a></li>
                        <li class="nav-item"><a class="nav-link" href="../planos/mensalidade.html">Planos</a></li>
                        <li class="nav-item"><a class="btn-main" href="../cadastro/formulario.html">Sair</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="custom-card shadow-lg">
                    <h2 class="mb-4 text-gold">Minha <span class="text-white">Conta</span></h2>
                    
                    <div id="dadosConta" class="mb-4">
                        </div>

                    <button id="editarBtn" class="btn btn-edit w-100 mb-3">Editar Perfil</button>

                    <form id="editarForm" style="display:none;" class="mt-4 border-top border-secondary pt-4">
                        <h3 class="h5 text-danger mb-3">Atualizar Informações</h3>
                        
                        <div class="mb-3">
                            <label class="form-label text-gray small">Nome</label>
                            <input type="text" class="form-control custom-input" id="editNome" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-gray small">Data de Nascimento</label>
                            <input type="date" class="form-control custom-input" id="editNascimento" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-gray small">Telefone</label>
                            <input type="tel" class="form-control custom-input" id="editTelefone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-gray small">E-mail</label>
                            <input type="email" class="form-control custom-input" id="editEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-gray small">Nível</label>
                            <select class="form-select custom-input" id="editNivel">
                                <option value="iniciante">Iniciante</option>
                                <option value="intermediario">Intermediário</option>
                                <option value="avancado">Avançado</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-gray small">Lesão/Condição</label>
                            <textarea class="form-control custom-input" id="editLesao" rows="2"></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn-main w-100">Salvar</button>
                            <button type="button" class="btn btn-outline-secondary w-100" onclick="location.reload()">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 mt-5 border-top border-secondary">
        <p class="small text-secondary">© 2026 Inside Muay Thai Valinhos. Disciplina e Honra.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const dados = JSON.parse(localStorage.getItem("dadosCadastro"));
            const div = document.getElementById("dadosConta");
            const editarBtn = document.getElementById("editarBtn");
            const editarForm = document.getElementById("editarForm");

            function mostrarDados() {
                if (dados) {
                    div.innerHTML = `
                        <div class="user-data-item"><strong>Nome:</strong> ${dados.nome}</div>
                        <div class="user-data-item"><strong>Nascimento:</strong> ${dados.nascimento}</div>
                        <div class="user-data-item"><strong>Telefone:</strong> ${dados.telefone}</div>
                        <div class="user-data-item"><strong>Email:</strong> ${dados.email}</div>
                        <div class="user-data-item"><strong>Nível:</strong> ${dados.nivel}</div>
                        <div class="user-data-item"><strong>Lesão:</strong> ${dados.lesao || 'Nenhuma'}</div>
                    `;
                } else {
                    div.innerHTML = "<div class='alert alert-dark text-gray'>Nenhum cadastro encontrado.</div>";
                    editarBtn.style.display = "none";
                }
            }

            mostrarDados();

            editarBtn.addEventListener("click", function() {
                editarForm.style.display = "block";
                editarBtn.style.display = "none";
                document.getElementById("editNome").value = dados.nome;
                document.getElementById("editNascimento").value = dados.nascimento;
                document.getElementById("editTelefone").value = dados.telefone;
                document.getElementById("editEmail").value = dados.email;
                document.getElementById("editNivel").value = dados.nivel;
                document.getElementById("editLesao").value = dados.lesao;
            });

            editarForm.addEventListener("submit", function(event) {
                event.preventDefault();
                const novosDados = {
                    nome: document.getElementById("editNome").value,
                    nascimento: document.getElementById("editNascimento").value,
                    telefone: document.getElementById("editTelefone").value,
                    email: document.getElementById("editEmail").value,
                    nivel: document.getElementById("editNivel").value,
                    lesao: document.getElementById("editLesao").value
                };
                localStorage.setItem("dadosCadastro", JSON.stringify(novosDados));
                alert("Dados atualizados com sucesso!");
                location.reload();
            });
        });
    </script>
</body>
</html>
